<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Personal Expense Tracker</h1>
        <p>Keep track of your daily expenses</p>
    </header>

    <main>

        <section class="summary">
            <div class="box">
                <h3>Total Expense</h3>
                <p id="totalExpense">₹0</p>
            </div>

            <div class="box">
                <h3>Number of Expenses</h3>
                <p id="expenseCount">0</p>
            </div>
        </section>

        <section class="tracker">

            <div class="form-box">
                <h2>Add Expense</h2>

                <form id="expenseForm">

                    <label>Expense Name</label>
                    <input type="text" id="expenseName" placeholder="Enter expense" maxlength="50" required>

                    <label>Amount</label>
                   <input
                    type="number"
                    id="expenseAmount"
                    placeholder="Enter amount"
                    min="0.01"
                    step="0.01"
                    required
                    >

                    <label>Category</label>
                    <select id="expenseCategory" required>
                        <option value="">Select Category</option>
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Other">Other</option>
                    </select>

                    <label>Date</label>
                    <input type="date" id="expenseDate" required>

                    <button type="submit">Add Expense</button>

                </form>
            </div>

            <div class="expense-box">
                <h2>My Expenses</h2>

                <div id="expenseList">
                    <p class="empty">No expenses added yet.</p>
                </div>
            </div>

        </section>

        <section class="category-box">
            <h2>Category Summary</h2>

            <div class="categories">
                <div>
                    <span>Food</span>
                    <strong id="foodTotal">₹0</strong>
                </div>

                <div>
                    <span>Travel</span>
                    <strong id="travelTotal">₹0</strong>
                </div>

                <div>
                    <span>Shopping</span>
                    <strong id="shoppingTotal">₹0</strong>
                </div>

                <div>
                    <span>Bills</span>
                    <strong id="billsTotal">₹0</strong>
                </div>

                <div>
                    <span>Other</span>
                    <strong id="otherTotal">₹0</strong>
                </div>
            </div>
        </section>

    </main>

    <footer>
        <p>Personal Expense Tracker</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
